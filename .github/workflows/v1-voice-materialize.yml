name: v1-voice-materialize
on:
  pull_request:
    paths:
      - 'tools/.v1-voice-stage/**'
      - '.github/workflows/v1-voice-materialize.yml'
permissions:
  contents: read
jobs:
  apply-reviewed-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/v1-loop-voice-integration-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: false
      - name: Verify and apply the reviewed source-only patch
        run: |
          set -euo pipefail
          git diff --exit-code 6d954a7bc200cd0ec300873e7e106fff2a87a692 -- firmware scripts tests tools ':!tools/.v1-voice-stage/**'
          cat tools/.v1-voice-stage/{0,1,2,3}.b64 | base64 -d > /tmp/voice.patch.gz
          echo '8617be662bc724c7efdb13a0412088c78de03c27fed13f3ccfdf2fb6f7f006a2  /tmp/voice.patch.gz' | sha256sum --check
          gzip -dc /tmp/voice.patch.gz > /tmp/voice.patch
          git apply --check /tmp/voice.patch
          git apply --index /tmp/voice.patch
          python3 - <<'PY'
          import subprocess
          expected = {
              'firmware/voice/VoiceRenderer.h', 'firmware/voice/VoiceRenderer.cpp',
              'firmware/voice/VoiceEffectsBus.cpp',
              'firmware/voice/experimental/PreparedLoopHandoff.h',
              'firmware/voice/experimental/PinnedLoopPlan.h',
              'tests/voice/test_loop_voice_oracle.py',
              'tests/voice/test_loop_voice_integration.cpp',
              'tests/voice/test_loop_voice_disabled_trace.cpp',
              'scripts/check_v1_voice_baselines.py', 'scripts/test_v1_loop_voice.sh',
              'scripts/check_v1_voice_disabled.sh', 'tools/v1_loop_voice_check.py',
              'tools/loop_voice_probe.cpp', 'docs/V1_PRODUCTION_VOICE_LOOP.md'}
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit('unexpected patch file set: ' + repr(actual ^ expected))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(v1): add default-off production Voice loop execution and exact regression gates'
          git push origin HEAD:refs/heads/agent/v1-loop-voice-integration-v1
