name: m6-sf2-playback-prepare-tests

on:
  push:
    branches: [main]
    paths:
      - "firmware/sf2/**"
      - "firmware/gm/MidiChannelState.*"
      - "firmware/gm/PlaybackProgramSnapshot.*"
      - "firmware/gm/ZoneResolver.*"
      - "firmware/realtime/RealtimeEventQueue.*"
      - "firmware/voice/VoiceRenderer.*"
      - "firmware/voice/VoiceRuntimeControl.*"
      - "tests/sf2/**"
      - "tests/gm/test_playback_zone_runtime.cpp"
      - "tests/gm/test_midi_channel*.cpp"
      - "assets/sf2/manifests/*.analysis.json"
      - "assets/sf2/subsets/*.sf2"
      - "scripts/run_phase_g_host_tests.sh"
      - ".github/workflows/m6-sf2-playback-prepare-tests.yml"
  pull_request:
    paths:
      - "firmware/sf2/**"
      - "firmware/gm/MidiChannelState.*"
      - "firmware/gm/PlaybackProgramSnapshot.*"
      - "firmware/gm/ZoneResolver.*"
      - "firmware/realtime/RealtimeEventQueue.*"
      - "firmware/voice/VoiceRenderer.*"
      - "firmware/voice/VoiceRuntimeControl.*"
      - "tests/sf2/**"
      - "tests/gm/test_playback_zone_runtime.cpp"
      - "tests/gm/test_midi_channel*.cpp"
      - "assets/sf2/manifests/*.analysis.json"
      - "assets/sf2/subsets/*.sf2"
      - "scripts/run_phase_g_host_tests.sh"
      - ".github/workflows/m6-sf2-playback-prepare-tests.yml"

jobs:
  phase-g-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run consolidated Phase G host validation
        shell: bash
        run: bash scripts/run_phase_g_host_tests.sh
