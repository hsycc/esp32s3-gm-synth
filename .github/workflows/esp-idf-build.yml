name: esp-idf-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "sdkconfig.defaults"
      - "sdkconfig.qemu.defaults"
      - "sdkconfig.hwbench.defaults"
      - "partitions_qemu.csv"
      - "main/**"
      - "firmware/**"
      - "scripts/build_idf.sh"
      - "scripts/build_hwbench_idf.sh"
      - "scripts/run_qemu_ci.sh"
      - "scripts/run_qemu_sf2_ci.sh"
      - "tools/program_prepare_benchmark/**"
      - "tools/render_benchmark/**"
      - "assets/sf2/subsets/FM_GM_Open_subset_6MiB.sf2"
      - "assets/sf2/manifests/subset-sha256.txt"
      - ".github/workflows/esp-idf-build.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "sdkconfig.defaults"
      - "sdkconfig.qemu.defaults"
      - "sdkconfig.hwbench.defaults"
      - "partitions_qemu.csv"
      - "main/**"
      - "firmware/**"
      - "scripts/build_idf.sh"
      - "scripts/build_hwbench_idf.sh"
      - "scripts/run_qemu_ci.sh"
      - "scripts/run_qemu_sf2_ci.sh"
      - "tools/program_prepare_benchmark/**"
      - "tools/render_benchmark/**"
      - "assets/sf2/subsets/FM_GM_Open_subset_6MiB.sf2"
      - "assets/sf2/manifests/subset-sha256.txt"
      - ".github/workflows/esp-idf-build.yml"

permissions:
  contents: read

jobs:
  build-esp32s3:
    # Keep the qualified LTS image; ubuntu-latest may change independently of DSP.
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - name: Record installer filesystem capacity
        shell: bash
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP" /tmp
          df -i "$RUNNER_TEMP" /tmp

      - name: Install pinned ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v6.1"
          eim-version: "v0.20.1"
          # Avoid the action's default /tmp/esp extraction quota.
          path: ${{ runner.temp }}/esp-idf
          tools-path: ${{ runner.temp }}/esp-tools

      - name: Configure ESP32-S3 target
        shell: bash
        run: |
          set -euo pipefail
          idf.py set-target esp32s3

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          idf.py build

      - name: Verify N16R8 baseline configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^CONFIG_IDF_TARGET="esp32s3"$' sdkconfig
          grep -q '^CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240=y$' sdkconfig
          grep -q '^CONFIG_COMPILER_OPTIMIZATION_PERF=y$' sdkconfig
          if grep -q '^CONFIG_COMPILER_OPTIMIZATION_DEBUG=y$' sdkconfig; then
            echo "Production/default firmware must not use DEBUG/-Og optimization" >&2
            exit 1
          fi
          grep -q '^CONFIG_ESPTOOLPY_FLASHMODE_DIO=y$' sdkconfig
          grep -q '^CONFIG_ESPTOOLPY_FLASHFREQ_80M=y$' sdkconfig
          grep -q '^CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y$' sdkconfig
          grep -q '^CONFIG_SPIRAM=y$' sdkconfig
          grep -q '^CONFIG_SPIRAM_MODE_OCT=y$' sdkconfig
          grep -q '^CONFIG_SPIRAM_SPEED_80M=y$' sdkconfig
          grep -q '^CONFIG_SPIRAM_USE_CAPS_ALLOC=y$' sdkconfig
          grep -q '^CONFIG_GM_SYNTH_PCM_ARENA_BYTES=4194304$' sdkconfig

      - name: Capture firmware size
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          idf.py size | tee reports/idf-size.txt

      - name: Boot firmware in ESP32-S3 QEMU
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_qemu_ci.sh reports/qemu-smoke.log

      - name: Run real SF2 from virtual flash FATFS in QEMU
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_qemu_sf2_ci.sh reports/qemu-sf2-flash.log

      - name: Render Program Prepare telemetry report
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f reports/qemu-sf2-flash.log ]]; then
            python -m tools.program_prepare_benchmark.report \
              reports/qemu-sf2-flash.log \
              --expected-samples 67 \
              --title "ESP32-S3 QEMU Program Prepare Functional Telemetry" \
              --output reports/qemu-program-prepare.md
            cat reports/qemu-program-prepare.md
          else
            echo "QEMU real-SF2 log was not produced; no Program Prepare report can be rendered." >&2
          fi

      - name: Render Voice DSP timing telemetry report
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.render_benchmark.report \
            reports/qemu-sf2-flash.log \
            --expected-voices 1 4 8 12 16 18 20 24 \
            --title "ESP32-S3 QEMU Voice DSP Render Timing Telemetry" \
            --output reports/qemu-render-timing.md
          cat reports/qemu-render-timing.md

      - name: Build physical N16R8 M6 qualification image
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p reports
          set +e
          bash scripts/build_hwbench_idf.sh 2>&1 | tee reports/physical-build.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ "${status}" -ne 0 ]]; then
            diagnostics="$(grep -E -C 3 'fatal error:|error:|undefined reference|CMake Error|FAILED:|ninja: build stopped' reports/physical-build.log | tail -n 240 || true)"
            {
              echo "### Physical N16R8 build diagnostics"
              echo '```text'
              if [[ -n "${diagnostics}" ]]; then
                printf '%s\n' "${diagnostics}"
              else
                tail -n 120 reports/physical-build.log
              fi
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"

            while IFS= read -r line; do
              [[ -n "${line}" ]] && echo "::error title=Physical ESP-IDF build::${line}"
            done < <(grep -E 'fatal error:|error:|undefined reference|CMake Error|ninja: build stopped' reports/physical-build.log | tail -n 20 || true)
          fi

          exit "${status}"

      - name: Upload QEMU diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-qemu-diagnostics
          path: |
            reports/qemu-smoke.log
            reports/qemu-sf2-flash.log
            reports/qemu-sf2-flash-preflight.log
            reports/qemu-program-prepare.md
            reports/qemu-render-timing.md
            reports/physical-build.log
            build-qemu-sf2/esp32s3_gm_synth.elf
            build-qemu-sf2/esp32s3_gm_synth.map
            sdkconfig.qemu
          if-no-files-found: warn

      - name: Upload physical N16R8 M6 qualification image
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-n16r8-m6-qualification
          path: |
            build-hwbench/bootloader/bootloader.bin
            build-hwbench/partition_table/partition-table.bin
            build-hwbench/esp32s3_gm_synth.bin
            build-hwbench/esp32s3_gm_synth.elf
            build-hwbench/esp32s3_gm_synth.map
            build-hwbench/qemu_sf2.bin
            build-hwbench/flash_args
            build-hwbench/flasher_args.json
            sdkconfig.hwbench
            sdkconfig.hwbench.defaults
          if-no-files-found: error

      - name: Upload flashable firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-n16r8-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/esp32s3_gm_synth.bin
            build/esp32s3_gm_synth.elf
            build/esp32s3_gm_synth.map
            build/flash_args
            build/flasher_args.json
            sdkconfig
            sdkconfig.qemu
            reports/idf-size.txt
            reports/qemu-smoke.log
            reports/qemu-sf2-flash.log
            reports/qemu-sf2-flash-preflight.log
            reports/qemu-program-prepare.md
            reports/qemu-render-timing.md
          if-no-files-found: error
