name: esp-idf-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "sdkconfig.defaults"
      - "sdkconfig.qemu.defaults"
      - "partitions_qemu.csv"
      - "main/**"
      - "firmware/**"
      - "scripts/build_idf.sh"
      - "scripts/run_qemu_ci.sh"
      - "scripts/run_qemu_sf2_ci.sh"
      - "assets/sf2/subsets/FM_GM_Open_subset_6MiB.sf2"
      - "assets/sf2/manifests/subset-sha256.txt"
      - ".github/workflows/esp-idf-build.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "sdkconfig.defaults"
      - "sdkconfig.qemu.defaults"
      - "partitions_qemu.csv"
      - "main/**"
      - "firmware/**"
      - "scripts/build_idf.sh"
      - "scripts/run_qemu_ci.sh"
      - "scripts/run_qemu_sf2_ci.sh"
      - "assets/sf2/subsets/FM_GM_Open_subset_6MiB.sf2"
      - "assets/sf2/manifests/subset-sha256.txt"
      - ".github/workflows/esp-idf-build.yml"

permissions:
  contents: read

jobs:
  build-esp32s3:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - name: Install pinned ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v6.1"

      - name: Configure ESP32-S3 target
        shell: bash
        run: |
          set -euo pipefail
          idf.py set-target esp32s3

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          idf.py build

      - name: Verify N16R8 baseline configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^CONFIG_IDF_TARGET="esp32s3"$' sdkconfig
          grep -q '^CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y$' sdkconfig
          grep -q '^CONFIG_SPIRAM=y$' sdkconfig
          grep -q '^CONFIG_SPIRAM_MODE_OCT=y$' sdkconfig
          grep -q '^CONFIG_SPIRAM_SPEED_80M=y$' sdkconfig
          grep -q '^CONFIG_SPIRAM_USE_CAPS_ALLOC=y$' sdkconfig
          grep -q '^CONFIG_GM_SYNTH_PCM_ARENA_BYTES=4194304$' sdkconfig

      - name: Capture firmware size
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          idf.py size | tee reports/idf-size.txt

      - name: Boot firmware in ESP32-S3 QEMU
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_qemu_ci.sh reports/qemu-smoke.log

      - name: Run real SF2 from virtual flash FATFS in QEMU
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_qemu_sf2_ci.sh reports/qemu-sf2-flash.log

      - name: Upload flashable firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-n16r8-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/esp32s3_gm_synth.bin
            build/esp32s3_gm_synth.elf
            build/esp32s3_gm_synth.map
            build/flash_args
            build/flasher_args.json
            sdkconfig
            sdkconfig.qemu
            reports/idf-size.txt
            reports/qemu-smoke.log
            reports/qemu-sf2-flash.log
          if-no-files-found: error
