name: key-index-product-tests-batch

on:
  push:
    branches:
      - agent/m6-key-index-integration-batch
    paths:
      - "scripts/apply_key_index_product_tests.py"
      - ".github/workflows/key-index-product-tests-batch.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6-key-index-integration-batch
          fetch-depth: 0
      - name: Apply product-path tests
        run: python3 scripts/apply_key_index_product_tests.py
      - name: Validate fast Phase G host matrix
        run: bash scripts/run_phase_g_fast_host_tests.sh
      - name: Validate M7 real-bank release matrix
        run: bash scripts/run_m7_sf2_release_matrix.sh
      - name: Commit validated tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/gm/ZoneResolver.h \
            tests/gm/test_playback_zone_runtime.cpp \
            tests/sf2/test_sf2_playback_program_preparer.cpp \
            tests/gm/test_program_change_control_service.cpp \
            tests/gm/test_m7_gm128_live_program_change.cpp \
            tests/gm/test_sf2_release_matrix.cpp
          git rm scripts/apply_key_index_product_tests.py .github/workflows/key-index-product-tests-batch.yml
          git commit -m "test: qualify indexed playback product path"
          git push origin HEAD:agent/m6-key-index-integration-batch
