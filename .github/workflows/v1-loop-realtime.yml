name: v1-loop-realtime
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/v1-loop-realtime.yml'
      - 'CMakeLists.txt'
      - 'firmware/**'
      - 'main/**'
      - 'profiles/v1-loop-realtime/**'
      - 'scripts/*v1_loop_realtime*'
      - 'scripts/check_v1_output_bypass.sh'
      - 'scripts/check_v1_realtime_render_equivalence.sh'
      - 'scripts/check_v1_loop_startup_default.py'
      - 'tools/v1_loop_realtime*'
      - 'tools/v1_loop_target_evidence.py'
      - 'tools/v1_atomic_backend_audit.py'
      - 'tests/app/**'
      - 'tests/realtime/test_output_bypass_trace.cpp'
      - 'tests/test_v1_loop_realtime.py'
      - 'tests/test_v1_loop_realtime_shell.py'
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  shell-macos:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise the build entry point with system Bash 3.2
        run: |
          /bin/bash --version
          /bin/bash -c '[[ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" == 3.2 ]]'
          python -m unittest tests.test_v1_loop_realtime_shell -v
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve frozen policy, original audio and startup defaults
        run: |
          python3 scripts/check_v1_voice_baselines.py
          python3 scripts/check_v1_loop_startup_default.py
          bash scripts/check_v1_output_bypass.sh
          python3 -m unittest tests.test_v1_loop_realtime tests.test_v1_loop_startup tests.test_v1_atomic_contract -v
      - name: Production provider, concurrent render and owner shutdown
        run: |
          mkdir -p build/v1-loop-realtime-host
          bash scripts/test_v1_loop_realtime.sh | tee build/v1-loop-realtime-host/native.log
          CXX=clang++ SANITIZE=1 V1_REALTIME_DIR=build/v1-loop-realtime-asan bash scripts/test_v1_loop_realtime.sh | tee build/v1-loop-realtime-host/asan.log
      - name: Preserve complete pre-fix real-bank and musical PCM in all four modes
        run: |
          bash scripts/check_v1_realtime_render_equivalence.sh
          cp build/v1-loop-realtime-render-equivalence/render-equivalence.json build/v1-loop-realtime-host/
          cp build/v1-loop-realtime-render-equivalence/frozen.log build/v1-loop-realtime-host/render-equivalence-reference.log
          cp build/v1-loop-realtime-render-equivalence/candidate.log build/v1-loop-realtime-host/render-equivalence-candidate.log
      - name: ThreadSanitizer ownership and publication races
        run: |
          CXX=g++ THREAD_SANITIZE=1 V1_REALTIME_DIR=build/v1-loop-realtime-tsan bash scripts/test_v1_loop_realtime.sh | tee build/v1-loop-realtime-host/tsan.log
      - name: Auditable source identity
        run: |
          git rev-parse HEAD > build/v1-loop-realtime-host/commit.txt
          git ls-tree -r HEAD > build/v1-loop-realtime-host/tree.txt
          git archive HEAD -- firmware main profiles scripts tests tools docs .github CMakeLists.txt | gzip > build/v1-loop-realtime-host/source.tar.gz
          sha256sum build/v1-loop-realtime-host/source.tar.gz > build/v1-loop-realtime-host/source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-loop-realtime-host
          path: |
            build/v1-loop-realtime-host/*.log
            build/v1-loop-realtime-host/*.json
            build/v1-loop-realtime-host/*.txt
            build/v1-loop-realtime-host/*.gz
            build/v1-loop-realtime-host/*.sha256
            build/v1-loop-realtime-host/audition/**
          if-no-files-found: error
  xtensa:
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [qemu, physical]
        mode: ['on', 'off']
        output: [bypass, peak]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: espressif/install-esp-idf-action@v1
        with:
          version: 'v6.1'
          eim-version: 'v0.20.1'
          path: ${{ runner.temp }}/esp-idf
          tools-path: ${{ runner.temp }}/esp-tools
      - name: Build continuous application, audit ABI and atomic backend, package exact flash inputs
        run: |
          out=build/v1-loop-realtime-${{ matrix.profile }}-${{ matrix.mode }}-${{ matrix.output }}
          log=$(mktemp "$RUNNER_TEMP/v1-loop-realtime-build.XXXXXXXX")
          status=0
          bash scripts/build_v1_loop_realtime.sh ${{ matrix.profile }} ${{ matrix.mode }} ${{ matrix.output }} 2>&1 | tee "$log" || status=$?
          mkdir -p "$out"
          mv "$log" "$out/build.log"
          exit "$status"
      - name: Rebuild physical off modes and verify preserved and current bundles
        if: matrix.profile == 'physical' && matrix.mode == 'off'
        run: |
          out=build/v1-loop-realtime-physical-off-${{ matrix.output }}
          before=$(mktemp "$RUNNER_TEMP/v1-loop-realtime-before.XXXXXXXX")
          cp "$out/flash-bundle/SHA256SUMS" "$before"
          log=$(mktemp "$RUNNER_TEMP/v1-loop-realtime-rebuild.XXXXXXXX")
          status=0
          bash scripts/build_v1_loop_realtime.sh physical off ${{ matrix.output }} 2>&1 | tee "$log" || status=$?
          mkdir -p "$out"
          mv "$log" "$out/rebuild.log"
          if [[ "$status" != 0 ]]; then exit "$status"; fi
          python - "$out" "$before" '${{ matrix.output }}' <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          from scripts.v1_loop_realtime_hardware import inspect_bundle

          out, before, mode = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3]
          history = list((out.parent / 'v1-loop-realtime-history').glob(f'physical-off-{mode}.*/build'))
          if len(history) != 1:
              raise ValueError('expected exactly one preserved build after one retry')
          archived, current = history[0] / 'flash-bundle', out / 'flash-bundle'
          old_sums = (archived / 'SHA256SUMS').read_bytes()
          if old_sums != before.read_bytes():
              raise ValueError('the previous bundle hash list changed during rebuild')
          manifests = [inspect_bundle(bundle) for bundle in (archived, current)]
          for manifest in manifests:
              if manifest['analysis'] is not False or manifest['output_mode'] != mode:
                  raise ValueError('rebuild changed the requested loop/output mode')
          if manifests[0]['source_tree'] != manifests[1]['source_tree']:
              raise ValueError('source tree changed during the repeated build')
          report = dict(schema=1, profile='physical', analysis=False, output_mode=mode,
                        source_tree=manifests[1]['source_tree'], archived_build=str(history[0]),
                        archived_bundle_unchanged=True, archived_bundle_valid=True,
                        current_bundle_valid=True,
                        archived_sha256sums_sha256=hashlib.sha256(old_sums).hexdigest(),
                        current_sha256sums_sha256=hashlib.sha256((current / 'SHA256SUMS').read_bytes()).hexdigest(),
                        runtime_approved=False, physical_timing_approved=False)
          text = json.dumps(report, indent=2) + '\n'
          (out / 'rebuild-verification.json').write_text(text)
          print(text, end='')
          PY
      - uses: actions/download-artifact@v4
        if: matrix.profile == 'qemu'
        with:
          name: v1-loop-realtime-host
          path: build/v1-loop-realtime-host
      - name: Execute real control/audio tasks in QEMU
        if: matrix.profile == 'qemu'
        run: bash scripts/run_v1_loop_realtime_qemu.sh ${{ matrix.mode }} ${{ matrix.output }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-loop-realtime-${{ matrix.profile }}-${{ matrix.mode }}-${{ matrix.output }}
          path: |
            build/v1-loop-realtime-${{ matrix.profile }}-${{ matrix.mode }}-${{ matrix.output }}/*.json
            build/v1-loop-realtime-${{ matrix.profile }}-${{ matrix.mode }}-${{ matrix.output }}/*.log
            build/v1-loop-realtime-${{ matrix.profile }}-${{ matrix.mode }}-${{ matrix.output }}/*.txt
            build/v1-loop-realtime-${{ matrix.profile }}-${{ matrix.mode }}-${{ matrix.output }}/sdkconfig
            build/v1-loop-realtime-${{ matrix.profile }}-${{ matrix.mode }}-${{ matrix.output }}/generated/*.h
            build/v1-loop-realtime-${{ matrix.profile }}-${{ matrix.mode }}-${{ matrix.output }}/generated/*.json
            build/v1-loop-realtime-${{ matrix.profile }}-${{ matrix.mode }}-${{ matrix.output }}/generated/*.sha256
            build/v1-loop-realtime-${{ matrix.profile }}-${{ matrix.mode }}-${{ matrix.output }}/flash-bundle/**
          if-no-files-found: error
