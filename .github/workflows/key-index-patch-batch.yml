name: key-index-patch-batch

on:
  push:
    branches:
      - agent/m6-key-index-integration-batch
    paths:
      - "scripts/apply_key_index_zone_resolver_patch.py"
      - ".github/workflows/key-index-patch-batch.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6-key-index-integration-batch
          fetch-depth: 0
      - name: Apply resolver patch
        run: python3 scripts/apply_key_index_zone_resolver_patch.py
      - name: Validate Phase G host matrix
        run: bash scripts/run_phase_g_fast_host_tests.sh
      - name: Commit validated resolver patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/gm/ZoneResolver.cpp
          git rm scripts/apply_key_index_zone_resolver_patch.py .github/workflows/key-index-patch-batch.yml
          git commit -m "m6: resolve note-on through prepared key index"
          git push origin HEAD:agent/m6-key-index-integration-batch
