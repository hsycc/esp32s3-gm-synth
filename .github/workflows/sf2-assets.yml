name: sf2-assets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sf2-assets.yml"
      - "tools/sf2_subset/**"
      - ".gitattributes"
      - "assets/sf2/SOURCES.md"

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Configure Git LFS
        run: |
          git lfs install
          mkdir -p assets/sf2/full assets/sf2/subsets assets/sf2/manifests assets/sf2/licenses

      - name: Download pinned public SoundFonts and licenses
        shell: bash
        run: |
          set -euo pipefail

          FM_COMMIT=5a20775a9c1b874effdaf1d131862748fdd135ba
          GU_COMMIT=684543d5e5efaef08d02be50dcda8d552478fa60

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/zeittresor/opensoundfont/${FM_COMMIT}/FM_GM_SoundFont_v0_2_1_mini.sf2" \
            -o assets/sf2/full/FM_GM_SoundFont_v0_2_1_mini.sf2
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/zeittresor/opensoundfont/${FM_COMMIT}/LICENSE" \
            -o assets/sf2/licenses/FM_GM_OpenSoundFont_GPL-3.0.txt

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/${GU_COMMIT}/GeneralUser-GS.sf2" \
            -o assets/sf2/full/GeneralUser-GS.sf2
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/${GU_COMMIT}/documentation/LICENSE.txt" \
            -o assets/sf2/licenses/GeneralUser-GS-LICENSE.txt

          curl --fail --location --retry 3 \
            "https://github.com/pianobooster/fluid-soundfont/releases/download/v3.1/FluidR3_GM.sf2" \
            -o assets/sf2/full/FluidR3_GM.sf2
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/pianobooster/fluid-soundfont/main/COPYING" \
            -o assets/sf2/licenses/FluidR3-MIT-COPYING.txt

          echo "9575028c7a1f589f5770fccc8cff2734566af40cd26ed836944e9a5152688cfe  assets/sf2/full/GeneralUser-GS.sf2" | sha256sum -c -

          sha256sum assets/sf2/full/*.sf2 > assets/sf2/manifests/full-source-sha256.txt
          ls -lh assets/sf2/full/*.sf2

      - name: Build comparable 6 MiB melodic SF2 fixtures
        shell: bash
        run: |
          set -euo pipefail

          python -m tools.sf2_subset.build_fixture \
            assets/sf2/full/FM_GM_SoundFont_v0_2_1_mini.sf2 \
            assets/sf2/subsets/FM_GM_Open_subset_6MiB.sf2 \
            --target-mib 6 \
            --manifest assets/sf2/manifests/FM_GM_Open_subset_6MiB.json

          python -m tools.sf2_subset.build_fixture \
            assets/sf2/full/GeneralUser-GS.sf2 \
            assets/sf2/subsets/GeneralUser_GS_subset_6MiB.sf2 \
            --target-mib 6 \
            --manifest assets/sf2/manifests/GeneralUser_GS_subset_6MiB.json

          python -m tools.sf2_subset.build_fixture \
            assets/sf2/full/FluidR3_GM.sf2 \
            assets/sf2/subsets/FluidR3_GM_subset_6MiB.sf2 \
            --target-mib 6 \
            --manifest assets/sf2/manifests/FluidR3_GM_subset_6MiB.json

          for sf2 in assets/sf2/subsets/*.sf2; do
            base="$(basename "$sf2" .sf2)"
            python -m tools.sf2_analyzer "$sf2" \
              --json "assets/sf2/manifests/${base}.analysis.json" >/dev/null
          done

          sha256sum assets/sf2/subsets/*.sf2 > assets/sf2/manifests/subset-sha256.txt
          ls -lh assets/sf2/subsets/*.sf2

      - name: Commit fixtures, licenses and sub-100MB full sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --renormalize assets/sf2/subsets || true
          git add \
            assets/sf2/subsets \
            assets/sf2/manifests \
            assets/sf2/licenses \
            assets/sf2/full/FM_GM_SoundFont_v0_2_1_mini.sf2 \
            assets/sf2/full/GeneralUser-GS.sf2
          if ! git diff --cached --quiet; then
            git commit -m "test-assets: add public SF2 baselines and fixtures [skip ci]"
            git push origin HEAD:main
          fi

      - name: Attempt oversized FluidR3 through Git LFS
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git add assets/sf2/full/FluidR3_GM.sf2
          if ! git diff --cached --quiet; then
            git commit -m "test-assets: add FluidR3 full baseline via LFS [skip ci]"
            git push origin HEAD:main
          fi
