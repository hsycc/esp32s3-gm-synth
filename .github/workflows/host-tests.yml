name: host-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q tools tests
      - name: Run Python host tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  cpp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sample residency host tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/host-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            firmware/sample/SampleResidencyManager.cpp \
            tests/sample/test_sample_residency.cpp \
            -o build/host-tests/test_sample_residency

          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -pthread \
            firmware/sample/SampleResidencyManager.cpp \
            firmware/sample/PublishedSampleDirectory.cpp \
            firmware/sample/ProgramSnapshot.cpp \
            tests/sample/test_sample_publication.cpp \
            -o build/host-tests/test_sample_publication
      - name: Run sample residency host tests
        run: ./build/host-tests/test_sample_residency
      - name: Run publication and program snapshot host tests
        run: ./build/host-tests/test_sample_publication
