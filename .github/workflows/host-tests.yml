name: host-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q tools tests
      - name: Run Python host tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  cpp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate real-bank dependency fixture and pressure report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/generated reports
          python -m tools.residency_fixture.generate_cpp_fixture \
            assets/sf2/manifests/FM_GM_Open_subset_6MiB.analysis.json \
            assets/sf2/manifests/GeneralUser_GS_subset_6MiB.analysis.json \
            assets/sf2/manifests/FluidR3_GM_subset_6MiB.analysis.json \
            --output build/generated/real_bank_dependencies.h \
            --report reports/residency_pressure.json \
            --budgets-mib 2 4 5 6

      - name: Build host tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/host-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            firmware/sample/SampleResidencyManager.cpp \
            tests/sample/test_sample_residency.cpp \
            -o build/host-tests/test_sample_residency

          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            firmware/sample/SampleResidencyManager.cpp \
            firmware/sample/SampleResidencySourceLoad.cpp \
            firmware/sample/SampleResidencyView.cpp \
            tests/sample/test_sample_source_load.cpp \
            -o build/host-tests/test_sample_source_load

          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -pthread \
            firmware/sample/SampleResidencyManager.cpp \
            firmware/sample/PublishedSampleDirectory.cpp \
            firmware/sample/ProgramSnapshot.cpp \
            tests/sample/test_sample_publication.cpp \
            -o build/host-tests/test_sample_publication

          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -pthread \
            firmware/sample/SampleResidencyManager.cpp \
            firmware/sample/SampleResidencySourceLoad.cpp \
            firmware/sample/SampleResidencyView.cpp \
            firmware/sample/PublishedSampleDirectory.cpp \
            firmware/sample/ProgramSnapshot.cpp \
            firmware/sample/ProgramPrepareController.cpp \
            tests/sample/test_program_prepare.cpp \
            -o build/host-tests/test_program_prepare

          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -pthread \
            firmware/sample/SampleResidencyManager.cpp \
            firmware/sample/SampleResidencySourceLoad.cpp \
            firmware/sample/SampleResidencyView.cpp \
            firmware/sample/PublishedSampleDirectory.cpp \
            firmware/sample/ProgramSnapshot.cpp \
            firmware/sample/ProgramPrepareController.cpp \
            tests/sample/test_program_source_prepare.cpp \
            -o build/host-tests/test_program_source_prepare

          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -pthread \
            -Ibuild/generated \
            firmware/sample/SampleResidencyManager.cpp \
            firmware/sample/SampleResidencySourceLoad.cpp \
            firmware/sample/SampleResidencyView.cpp \
            firmware/sample/PublishedSampleDirectory.cpp \
            firmware/sample/ProgramSnapshot.cpp \
            firmware/sample/ProgramPrepareController.cpp \
            tests/sample/test_real_bank_dependencies.cpp \
            -o build/host-tests/test_real_bank_dependencies

          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -pthread \
            firmware/sample/SampleResidencyManager.cpp \
            firmware/sample/SampleResidencySourceLoad.cpp \
            firmware/sample/SampleResidencyView.cpp \
            firmware/sample/PublishedSampleDirectory.cpp \
            firmware/sample/ProgramSnapshot.cpp \
            firmware/sample/ProgramPrepareController.cpp \
            firmware/sf2/Sf2SampleSource.cpp \
            tests/sf2/test_sf2_sample_source.cpp \
            -o build/host-tests/test_sf2_sample_source

          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            firmware/storage/VfsRandomAccessReader.cpp \
            firmware/sf2/Sf2SampleSource.cpp \
            tests/storage/test_vfs_random_access_reader.cpp \
            -o build/host-tests/test_vfs_random_access_reader

          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            firmware/storage/StorageReadBenchmark.cpp \
            tests/storage/test_storage_read_benchmark.cpp \
            -o build/host-tests/test_storage_read_benchmark

          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            firmware/gm/ProgramChangeMailbox.cpp \
            firmware/sample/ProgramSnapshot.cpp \
            tests/gm/test_program_change_mailbox.cpp \
            -o build/host-tests/test_program_change_mailbox

      - name: Run sample residency host tests
        run: ./build/host-tests/test_sample_residency
      - name: Run direct-to-arena source load tests
        run: ./build/host-tests/test_sample_source_load
      - name: Run publication and program snapshot host tests
        run: ./build/host-tests/test_sample_publication
      - name: Run transactional program prepare host tests
        run: ./build/host-tests/test_program_prepare
      - name: Run source-backed program prepare host tests
        run: ./build/host-tests/test_program_source_prepare
      - name: Run generated real-bank dependency tests
        run: ./build/host-tests/test_real_bank_dependencies
      - name: Run native SF2 sample-source tests
        run: ./build/host-tests/test_sf2_sample_source
      - name: Run VFS random-access reader integration tests
        run: ./build/host-tests/test_vfs_random_access_reader
      - name: Run storage read benchmark tests
        run: ./build/host-tests/test_storage_read_benchmark
      - name: Run rapid Program Change mailbox tests
        run: ./build/host-tests/test_program_change_mailbox
      - name: Print residency pressure report
        run: cat reports/residency_pressure.json
      - name: Upload residency pressure report
        uses: actions/upload-artifact@v4
        with:
          name: residency-pressure-report
          path: reports/residency_pressure.json
          if-no-files-found: error
